<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedTech AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #16324f;
      background: #f3f8fc;
    }

    header {
      padding: 24px 8%;
      color: white;
      background: #087e8b;
    }

    main {
      max-width: 850px;
      margin: 70px auto;
      padding: 0 24px;
      text-align: center;
    }

    h1 { font-size: 44px; }
    p { font-size: 18px; line-height: 1.6; }

    .notice {
      margin-top: 40px;
      padding: 18px;
      border-radius: 10px;
      background: #e1f1f2;
    }
  </style>
</head>
<body>
  <header><strong>MedTech AI</strong></header>

  <main>
    <h1>Mjekësia dhe teknologjia, së bashku</h1>
    <p>
      MedTech AI është një projekt në zhvillim që synon të ndërthurë
      mjekësinë, teknologjinë dhe inteligjencën artificiale.
    </p>

    <div class="notice">
      <strong>Projekt në zhvillim</strong>
      <p>Informacioni këtu nuk zëvendëson këshillën e një profesionisti shëndetësor.</p>
    </div>
  </main>
</body>
</html>
